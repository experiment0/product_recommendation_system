[project]
name = "product-recommendation-system"
version = "0.1.0"
description = "Product recommendation system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

# Система сборки пакета
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# По какому пути брать файлы для пакета
[tool.hatch.build.targets.wheel]
packages = ["rec_sys"]
